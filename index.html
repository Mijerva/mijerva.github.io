<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mijerva</title>
<meta name="description" content="Small, open-source tools: SoftKVM, EpsonReset and TRCC-LCD.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/Ruluko-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="style.css">
<script>
  // Applied before the page paints, so a saved theme never flashes.
  try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="page">
  <nav aria-label="Main">
    <svg class="brand-mark" width="34" height="35" viewBox="0 0 100 104" role="img" aria-label="Mijerva"><g fill="none" stroke="currentColor" stroke-width="19"><path d="M20 88V52a19 19 0 0 1 19-19"/><path d="M50 52v36"/><path d="M61 33a19 19 0 0 1 19 19v34a13 13 0 0 1-13 13h-5"/></g><circle cx="50" cy="18" r="10" fill="var(--accent)"/></svg><span class="wordmark">mijerva</span>
    <div class="links"><a href="#tools">Tools</a><a href="https://github.com/Mijerva" target="_blank" rel="noopener">GitHub</a><a href="#about">About</a><button type="button" class="theme" id="theme"><svg class="moon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="sun" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></button></div>
  </nav>

  <main class="stage" id="tools">
    <div class="text swap" id="text">
      <div class="project"><span id="name"></span><span class="state" id="state"></span></div>
      <h1 id="headline"></h1>
      <p id="about-text"></p>
      <p class="note" id="note"></p>
      <a class="go" id="go" target="_blank" rel="noopener">See it on GitHub</a>
    </div>

    <div class="gallery" id="gallery" aria-label="Pictures of the tools"></div>
  </main>

  <footer id="about"><span>Made in Sweden by one person.</span>
    <div class="controls" aria-label="Gallery">
      <button type="button" id="prev" aria-label="Previous picture">&#8593;</button>
      <span class="count" id="count"></span>
      <button type="button" id="next" aria-label="Next picture">&#8595;</button>
      <button type="button" id="pause" aria-pressed="false">Pause</button>
    </div>
  </footer>
</div>
